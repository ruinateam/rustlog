[package]
name = "rustlog"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
aide = { version = "0.15.0", features = [
    "axum",
    "axum-json",
    "axum-query",
    "axum-ws",
    "scalar",
] }
anyhow = "1.0.75"
axum = { version = "0.8.4", features = ["tokio", "ws"] }
chrono = { version = "0.4.27", features = ["serde"] }
clap = { version = "4.4.1", features = ["derive"] }
clickhouse = { version = "0.15.1", default-features = false, features = [
    "lz4",
    "uuid",
    "inserter",
] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
dashmap = { version = "6.1.0", features = ["serde"] }
flate2 = "1.0.27"
futures = "0.3.28"
indexmap = "2.2.6"
mimalloc = { version = "0.1.38", default-features = false }
mime_guess = "2.0.4"
prometheus = "0.13.3"
rand = "0.9.0"
rayon = "1.7.0"
reqwest = { version = "0.12.4", features = [
    "rustls-tls",
    "json",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
], default-features = false }
rust-embed = { version = "8.0.0", features = [
    "interpolate-folder-path",
], optional = true }
schemars = { version = "0.9", features = ["chrono04"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = { version = "1.0.105", features = ["preserve_order"] }
serde_repr = "0.1.16"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.32.0", features = ["sync", "signal", "rt-multi-thread"] }
tower-http = { version = "0.6.1", features = [
    "trace",
    "cors",
    "normalize-path",
    "compression-full",
] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
twitch-irc = { version = "5.0.1", default-features = false, features = [
    "metrics-collection",
    "transport-tcp-rustls-webpki-roots",
] }
twitch_api = { version = "0.7.0", features = [
    "client",
    "helix",
    "reqwest",
    "twitch_oauth2",
] }
tmi = { version = "0.7.0", default-features = false, features = ["simd"] }
axum-prometheus = "0.8.0"
metrics-prometheus = "0.8.0"
axum-extra = { version = "0.10.0", features = ["typed-header"] }
bitflags = { version = "2.5.0", features = ["serde"] }

[features]
# Compile the built web frontend (`web/dist`) into the binary. Without it a
# placeholder page is served, so the backend builds without a Node toolchain.
embed-frontend = ["dep:rust-embed"]

[dev-dependencies]
insta = "1.48.0"
pretty_assertions = "1.4.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# Line tables keep file and line numbers in backtraces; full debug info
# mostly bloats target/ and slows down linking. Dependencies get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"

# Used by the Docker image: slower to build, but a smaller and faster binary.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
