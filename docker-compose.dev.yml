services:
  rustlog:
    build:
      context: .
      target: runtime
    image: rustlog:dev
    restart: unless-stopped
    init: true
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      RUSTLOG_CLICKHOUSE_URL: "http://clickhouse:8123"
      RUSTLOG_CLICKHOUSE_DB: "rustlog"
      RUSTLOG_CLICKHOUSE_USERNAME: "${CLICKHOUSE_USER:-user}"
      RUSTLOG_CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
      RUSTLOG_LISTEN_ADDRESS: "0.0.0.0:8026"
    volumes:
      - "./config.json:/app/config.json:ro"
    ports:
      - 8026:8026

  clickhouse:
    image: clickhouse/clickhouse-server:26.5.6.64
    restart: unless-stopped
    volumes:
      - "rustlog_ch_data:/var/lib/clickhouse:rw"
    environment:
      CLICKHOUSE_DB: "rustlog"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-user}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}"
    ports:
      - 8123:8123
      - 9000:9000
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  rustlog_ch_data:
