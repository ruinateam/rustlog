[graph]
all-features = true

[advisories]
yanked = "deny"
# TODO: drop this once prometheus 0.13 is gone.
ignore = [
    # protobuf 2 via prometheus 0.13; only used to encode metrics, never to
    # parse untrusted input.
    { id = "RUSTSEC-2024-0437", reason = "protobuf 2 comes from prometheus 0.13" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
