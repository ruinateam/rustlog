[graph]
all-features = true

[advisories]
yanked = "deny"
# TODO: drop these once twitch-irc and prometheus 0.13 are replaced.
ignore = [
    # protobuf 2 via prometheus 0.13; only used to encode metrics, never to
    # parse untrusted input.
    { id = "RUSTSEC-2024-0437", reason = "protobuf 2 comes from prometheus 0.13 and twitch-irc" },
    # rustls-webpki 0.101 via twitch-irc's rustls 0.21, used only for the
    # connection to Twitch IRC.
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101 comes from twitch-irc" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101 comes from twitch-irc" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101 comes from twitch-irc" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
