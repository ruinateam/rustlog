<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Twitch chat logs and chat tiers" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>rustlog</title>
    <script>
      // Picks the theme before the first paint, so the page does not flash.
      const theme = localStorage.getItem('vueuse-color-scheme') ?? 'auto'
      const dark =
        theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
